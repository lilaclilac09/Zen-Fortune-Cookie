
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zen Fortune Cookie</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MediaPipe dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px) rotate(-2deg); }
      75% { transform: translateX(8px) rotate(2deg); }
    }
    .animate-shake {
      animation: shake 0.15s ease-in-out infinite;
    }
    
    @keyframes paper-slip-out {
      0% { 
        transform: translate(-50%, -20px) scaleY(0); 
        opacity: 0; 
      }
      30% {
        opacity: 1;
      }
      100% { 
        transform: translate(-50%, 40px) scaleY(1); 
        opacity: 1; 
      }
    }
    .animate-paper {
      animation: paper-slip-out 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      transform-origin: top center;
    }

    @keyframes particle-burst {
      0% { transform: scale(1) translate(0, 0); opacity: 1; }
      100% { transform: scale(0) translate(var(--tw-translate-x), var(--tw-translate-y)); opacity: 0; }
    }
    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      background-color: #fcd34d;
      border-radius: 2px;
      animation: particle-burst 0.6s ease-out forwards;
    }
    
    .paper-texture {
      background: linear-gradient(to bottom, #fff 0%, #f9f9f9 100%);
      box-shadow: 0 4px 15px rgba(0,0,0,0.1), inset 0 0 10px rgba(0,0,0,0.02);
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body class="bg-gradient-to-br from-amber-50 to-orange-100 min-h-screen overflow-hidden">
  <div id="root"></div>
</body>
</html>
